name: Generar contenido semanal de Plexglobe

on:
  schedule:
    # Domingos a las 16:00 UTC = 18:00 en Madrid (horario de verano)
    - cron: "0 16 * * 0"
  workflow_dispatch:        # y tambien a mano, desde la pestana Actions

permissions:
  contents: write           # necesario para que el bot pueda commitear las imagenes

jobs:
  generar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install --quiet pillow numpy
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Renderizar las piezas de la semana
        run: python3 generar.py

      - name: Renderizar los reels
        # Los videos se generan aqui y no se suben desde el portatil: son
        # binarios de 1-3 MB y asi el repositorio solo recibe codigo.
        run: |
          python3 video.py
          for s in 1 2 3 4; do python3 _semana.py $s; done

      - name: Reescribir el catalogo con los enlaces de video
        run: python3 generar.py

      - name: Publicar imagenes en el repositorio
        run: |
          git config user.name  "plexglobe-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A salida/
          if git diff --staged --quiet; then
            echo "Sin cambios: nada que commitear."
          else
            git commit -m "Contenido semanal $(date +'%Y-%m-%d')"
            git push
          fi

      - name: Resumen
        run: |
          echo "### Contenido generado" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -la salida/ >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
